[project]
name = "swipread-reco"
version = "1.0.1"
description = "Swipread recommender: topic-weight feed recommendations served to the API"
readme = "README.md"
license = { text = "All rights reserved" }
authors = [{ name = "Swipread" }]
requires-python = ">=3.12,<3.13"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    "numpy>=2.1",
    "sentence-transformers>=3.3",
    # Direct dependency so that its source below applies: CPU-only wheels on Linux.
    "torch>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fakeredis>=2.26",
    "httpx>=0.28",
    "ruff>=0.8",
]

# On Linux (CI, the Docker image) torch comes from PyTorch's CPU index: the PyPI wheels pull
# about 3 GB of CUDA libraries the recommender never uses. Other platforms keep PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swipread_reco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "integration: needs real PostgreSQL and Redis (skipped unless RECO_TEST_DSN is set)",
    "perf: performance tests",
    "e2e: end-to-end tests against the real backend (run by scripts/e2e.sh, skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
